@font-face{font-family:"Plex";font-weight:400;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plex";font-weight:500;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Plex";font-weight:400;font-display:swap;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Plex";font-weight:500;font-display:swap;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
:root{
  /* Laqeetha brand (Mostafa's identity): navy = trust, amber = the lost item, green = found/returned */
  --navy:#13294B; --ink:#13294B; --deep:#0B1A30; --tint:#E9EDF4; --paper:#F7F8FA; --card:#FFFFFF;
  --line:#E1E5EC; --muted:#5B6678; --amber:#F4A12A; --green:#1FA971; --green-bright:#2BC487; --green-text:#13874F;
  --redact:#0B1A30; --holder:#F4A12A; --body:#2E3D57;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 "Plex",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.narrow{max-width:680px}

/* top */
.top{display:flex;align-items:center;gap:10px;padding:16px 0}
.top img{height:36px;width:auto}
.top .name{flex:1;font-size:13.5px;color:var(--muted);unicode-bidi:isolate;border-inline-start:1px solid var(--line);padding-inline-start:12px;line-height:36px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.top{padding-bottom:8px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none;margin:0 -2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-size:14.5px;padding:7px 14px;border-radius:999px;color:var(--muted);border:1px solid transparent}
.nav a:hover{color:var(--ink);background:var(--tint)}
.nav a[aria-current=page]{color:var(--ink);background:var(--card);border-color:var(--line);font-weight:500}
.more{display:grid;gap:12px;margin-top:22px}
@media(min-width:800px){.more{grid-template-columns:repeat(3,1fr)}}
.more a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.more a b{display:block;font-weight:500;margin-bottom:2px}
.more a span{font-size:14.5px;color:var(--muted)}
.more a:hover{border-color:var(--navy)}

/* hero */
.hero{display:grid;gap:28px;padding:18px 0 56px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1.05fr .95fr;gap:56px;padding:40px 0 80px}}
h1{font-size:clamp(34px,8vw,56px);line-height:1.12;margin:0 0 18px;font-weight:500;letter-spacing:-.5px;text-wrap:balance}
.hero p{font-size:18.5px;color:var(--body);margin:0 0 24px;max-width:34em}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;text-decoration:none;font-weight:500;padding:13px 20px;border-radius:8px;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

/* the post: exposed, then redacted */
.post{background:#EDF0F5;border-radius:20px;padding:22px;position:relative}
.group{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.group i{width:34px;height:34px;border-radius:50%;background:#C5CEDB;display:block}
.group b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.bubble{background:var(--card);border-radius:20px;border-start-start-radius:6px;padding:12px;box-shadow:0 1px 2px rgba(11,26,48,.08);max-width:440px}
.holder{background:var(--holder);border-radius:14px;padding:12px}
.idcard{background:#FDFDF9;border-radius:9px;padding:14px;display:grid;grid-template-columns:1fr 26%;gap:14px;font-size:14.5px;line-height:1.5;position:relative}
[dir=ltr] .idcard{grid-template-columns:26% 1fr}
[dir=ltr] .idcard .photo{order:-1}
[dir=ltr] .idcard .hd{order:-2}
.idcard .hd{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11.5px;color:#5B6678;border-bottom:1px solid #E1E5EC;padding-bottom:6px}
.fields{display:flex;flex-direction:column;gap:7px}
.fields div{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.fields small{color:#5B6678;font-size:12.5px}
.fields .v{position:relative;font-weight:500;padding:0 3px}
.fields .v::before{content:"";position:absolute;inset:-1px -2px;background:var(--amber);border-radius:3px;z-index:0;transform-origin:inline-start;animation:mark .5s .5s both}
.fields .v::after{content:"";position:absolute;inset:-3px -4px;background:var(--redact);border-radius:3px;z-index:2;transform:scaleX(0);transform-origin:right;animation:redact .45s both}
[dir=ltr] .fields .v::after{transform-origin:left}
.fields div:nth-child(1) .v::after{animation-delay:2.4s}
.fields div:nth-child(2) .v::after{animation-delay:2.6s}
.fields div:nth-child(3) .v::after{animation-delay:2.8s}
.fields .v span{position:relative;z-index:1}
.photo{background:linear-gradient(#C5CEDB,#AEB9C9);border-radius:6px;aspect-ratio:.8;position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;inset:0;background:var(--redact);transform:scaleY(0);transform-origin:top;animation:redactY .45s 3s both}
.stamp{position:absolute;inset-inline-end:-10px;bottom:-14px;background:var(--navy);color:#fff;border-radius:999px;padding:7px 14px 7px 12px;display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;box-shadow:0 6px 16px rgba(19,41,75,.35);animation:stamp .35s 3.4s both}
.stamp svg{width:17px;height:17px;color:var(--green-bright)}
.meta{font-size:12.5px;color:#5B6678;margin:8px 4px 0;display:flex;justify-content:space-between;gap:12px}
.meta span:last-child{flex:none}
.caption{margin:22px 4px 0;font-size:15px;min-height:3.2em;position:relative}
.caption span{position:absolute;inset:0;transition:opacity .4s}
.caption .before{animation:hide .3s 3.4s both}
.caption .after{opacity:0;animation:show .4s 3.5s both;color:var(--green-text);font-weight:500}
@keyframes mark{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes redact{to{transform:scaleX(1)}}
@keyframes redactY{to{transform:scaleY(1)}}
@keyframes stamp{from{opacity:0;transform:scale(1.4) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes hide{to{opacity:0}}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .fields .v::before,.fields .v::after,.photo::after,.stamp,.caption .before,.caption .after{animation-duration:.01s!important;animation-delay:0s!important}
}

/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,5.5vw,36px);line-height:1.2;margin:0 0 14px;letter-spacing:-.3px;text-wrap:balance}
.lead{font-size:18px;color:var(--body);margin:0 0 26px;max-width:36em}

.problem{display:grid;gap:28px;align-items:center}
@media(min-width:900px){.problem{grid-template-columns:.9fr 1.1fr;gap:48px}}
.count{display:flex;align-items:baseline;gap:14px;margin:0 0 14px}
.count b{font-size:72px;line-height:1;font-weight:500;color:var(--ink)}
.count b small{font-size:30px;color:var(--muted);font-weight:500}
.count span{font-size:17px;max-width:16em}
.evidence{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.cap{font-size:13.5px;color:var(--muted);margin-top:8px}
.channels{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.channels span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14.5px}

/* steps with phone screens */
.steps{display:grid;gap:44px;margin-top:10px}
.step{display:grid;gap:22px;align-items:center}
@media(min-width:800px){.step{grid-template-columns:1fr 300px;gap:56px}.step:nth-child(even) .phone{order:-1}}
.step .n{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:500;margin-bottom:12px}
.step h3{font-size:24px;line-height:1.3;margin:0 0 8px}
.step p{margin:0;color:var(--body);max-width:30em}
.phone{width:min(270px,78vw);margin:0 auto;border-radius:38px;padding:9px;background:var(--ink);box-shadow:0 18px 40px -16px rgba(11,26,48,.45)}
.phone img{display:block;width:100%;border-radius:30px;aspect-ratio:390/844;object-fit:cover;object-position:top;background:#fff}

/* privacy band */
.privacy + section{border-top:0}
.privacy{background:var(--deep);color:#fff;border-radius:32px;padding:40px 24px;margin:0 -4px;border:0}
.privacy h2{color:#fff}
.privacy .lead{color:#C5CEDB}
.pair{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pair .phone{background:#06111F;width:min(230px,42vw)}
.pair figure{margin:0;text-align:center}
.pair figcaption{font-size:14px;color:#C5CEDB;margin-top:12px;max-width:16em;margin-inline:auto}
.rules{display:grid;gap:12px;margin:0 0 30px;padding:0;list-style:none;max-width:40em}
.rules li{display:flex;gap:12px;align-items:flex-start}
.rules svg{flex:none;width:22px;height:22px;color:var(--green-bright);margin-top:3px}

/* proof */
.proof{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 20px;margin-top:6px}
@media(min-width:800px){.proof{grid-template-columns:repeat(4,1fr)}}
.proof div{border-top:3px solid var(--navy);padding-top:12px}
.proof b{display:block;font-size:38px;line-height:1.1;font-weight:500}
.proof span{font-size:15px;color:var(--body)}
.small{font-size:14px;color:var(--muted);margin-top:22px;max-width:44em}

.places{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.places span{border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--card);font-weight:500}
.places span.now{background:var(--navy);color:#fff;border-color:var(--navy)}

.team{display:grid;gap:10px;margin:6px 0 26px}
@media(min-width:900px){.team{grid-template-columns:repeat(3,1fr)}}
.person{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.person small{display:block;color:var(--muted);font-size:13.5px}
.person a{color:var(--green-text);font-weight:500;font-size:14.5px;text-decoration:none}
.ask{background:var(--tint);border-radius:16px;padding:28px 24px}
.ask h3{font-size:22px;margin:0 0 6px}
.ask p{margin:0 0 18px;color:var(--body)}
footer{padding:36px 0 50px;color:var(--muted);font-size:13.5px}

/* the explainer film */
.film{padding-top:8px;border-top:0}
.film .video{position:relative;border-radius:24px;overflow:hidden;background:#F5F6FA;box-shadow:0 24px 50px -28px rgba(11,26,48,.45);border:1px solid var(--line);aspect-ratio:16/9}
.film video{display:block;width:100%;height:100%;object-fit:cover}
.sound{position:absolute;inset-inline-start:14px;bottom:56px;display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;box-shadow:0 6px 18px rgba(11,26,48,.35);transition:transform .15s}
.sound:active{transform:scale(.96)}
.sound svg{width:18px;height:18px}
.film figcaption{font-size:13.5px;color:var(--muted);margin-top:10px}
.film h2{margin-bottom:16px}
</style>
</head>
